<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="hud">
      <span class="brand">PONG<span class="brand-dot">.</span></span>

      <div class="scoreboard">
        <div class="score score--p1">
          <span class="label">Player 01</span>
          <span id="score1" class="value">0</span>
        </div>
        <span class="score-divider">—</span>
        <div class="score score--p2">
          <span class="label" id="p2Label">CPU</span>
          <span id="score2" class="value">0</span>
        </div>
      </div>
    </header>

    <div id="game">
      <div id="overlay" class="overlay" hidden>
        <div class="overlay-card">
          <span id="overlayTitle" class="overlay-title"></span>
          <span id="overlaySubtitle" class="overlay-subtitle"></span>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="mode">
        <button id="mode1p" class="active">1 Jogador (vs CPU)</button>
        <button id="mode2p">2 Jogadores</button>
      </div>
      <button id="pauseBtn">Pausar</button>
      <button id="restartBtn">Reiniciar</button>
      <button id="fullscreenBtn">Tela cheia</button>
    </div>

    <p class="hint">
      Jogador 1: <kbd>W</kbd> / <kbd>S</kbd> &nbsp;|&nbsp;
      Jogador 2: <kbd>&uarr;</kbd> / <kbd>&darr;</kbd> &nbsp;|&nbsp;
      <kbd>Espaço</kbd> pausa
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="game.js"></script>
</body>
</html>
